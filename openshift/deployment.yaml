apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibm-catalog-advisor
  namespace: ibm-catalog-advisor
  labels:
    app: ibm-catalog-advisor
    app.kubernetes.io/name: ibm-catalog-advisor
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/component: app
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"ibm-catalog-advisor:latest"},"fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ibm-catalog-advisor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ibm-catalog-advisor
        app.kubernetes.io/name: ibm-catalog-advisor
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ibm-catalog-advisor
          image: image-registry.openshift-image-registry.svc:5000/ibm-catalog-advisor/ibm-catalog-advisor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # The watsonx API key — stored as a secret, injected at runtime.
            # Create it with:
            #   oc create secret generic watsonx-api-key \
            #     --from-literal=apikey=YOUR_KEY -n ibm-catalog-advisor
            - name: WATSONX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: watsonx-api-key
                  key: apikey
            # Optional: override the deployment URL if region/deployment differ
            # - name: WATSONX_DEPLOYMENT_URL
            #   value: "https://au-syd.ml.cloud.ibm.com/ml/v1/deployments/wbplangen/text/generation?version=2021-05-01"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
