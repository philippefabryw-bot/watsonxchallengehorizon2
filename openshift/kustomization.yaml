apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ibm-catalog-advisor

resources:
  - imagestream.yaml
  - buildconfig.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

# NOTE: the watsonx-api-key secret is intentionally NOT managed here.
# Create it once, out-of-band, so the key never lives in Git:
#   oc create secret generic watsonx-api-key \
#     --from-literal=apikey=YOUR_KEY -n ibm-catalog-advisor

commonLabels:
  app: ibm-catalog-advisor
  app.kubernetes.io/name: ibm-catalog-advisor
  app.kubernetes.io/part-of: ibm-catalog-advisor
