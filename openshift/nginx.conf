worker_processes auto;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Write temp files to /tmp so no root is needed
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /tmp/nginx_access.log;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen       8080;
        server_name  localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Proxy /wx-api/* → watsonx AU-SYD (avoids browser CORS restrictions)
        # Must be declared BEFORE location / so nginx doesn't match the SPA catch-all first.
        location /wx-api/ {
            proxy_pass              https://au-syd.ml.cloud.ibm.com/;
            proxy_http_version      1.1;
            proxy_ssl_server_name   on;
            proxy_ssl_name          au-syd.ml.cloud.ibm.com;
            proxy_set_header        Host          au-syd.ml.cloud.ibm.com;
            proxy_set_header        Authorization $http_authorization;
            proxy_set_header        Content-Type  $http_content_type;
            proxy_set_header        Accept        $http_accept;
            proxy_pass_request_body on;
            proxy_pass_header       Authorization;
            # Required for streaming (SSE / chunked transfer)
            proxy_buffering         off;
            proxy_cache             off;
            chunked_transfer_encoding on;
        }

        # React SPA — serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health-check endpoint for OpenShift probes
        location /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        error_page 404 /index.html;
    }
}
